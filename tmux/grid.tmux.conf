# claude-code-grid — tmux config. Source from ~/.tmux.conf:
#   source-file ~/dev/claude-code-grid/tmux/grid.tmux.conf

# Keep window names as set by the grid instead of tmux overwriting them with
# whatever process is running; Claude Code also rewrites the terminal title
# via escape sequences, which is why panes are labeled with @repo user
# options rather than pane_title.
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Terminal tab title: session + active pane's repo (falls back to window
# name outside the grids).
set-option -g set-titles on
set-option -g set-titles-string "#S · #{?#{@repo},#{@repo},#W}"

# Per-pane colored border labels: repo name in its @repo_color, current
# branch, and a live git dirty(●)/clean(✓) indicator. Panes without @repo
# (normal tmux use) just show their title. Refreshes every status-interval.
set-option -g pane-border-status top
set-option -g pane-border-format "#(~/dev/claude-code-grid/scripts/pane-border.sh '#{@repo}' '#{@repo_color}' '#{pane_current_path}' '#{pane_title}')"

# prefix+b toggles typing into ALL panes at once (e.g. tell every claude
# session "commit and push" in one go). Status bar shows a red BROADCAST
# banner while it's on so you can't forget.
bind-key b set-window-option synchronize-panes

# Status bar: aggregate Claude plan usage for the attached session's account
# (limits are account-wide, so one readout covers every pane).
set-option -g status-interval 15
set-option -g status-right-length 80
set-option -g status-right "#{?pane_synchronized,#[bg=colour203 fg=colour232 bold] ⇄ BROADCAST #[default] ,}#(~/dev/claude-code-grid/scripts/tmux-usage.sh '#{session_name}')%H:%M "

# Safety net: whenever ANY tmux session closes, the dispatcher checks
# whether it was one of the claude grids (has a worktree state file) and
# runs the safe prune on it. Catches raw kill-session/closing the terminal,
# not just pdev-stop/wdev-stop.
set-hook -g session-closed 'run-shell "~/dev/claude-code-grid/scripts/prune-dispatch.sh #{hook_session_name}"'

# Session persistence across reboots: resurrect saves layout/paths
# (prefix+Ctrl-s manual save, prefix+Ctrl-r restore); continuum auto-saves
# every 10 min and auto-restores when the tmux server first starts after a
# reboot. Panes come back as shells in their repo dirs — re-run pdev/wdev or
# `claude --resume` to pick conversations back up. Pinned versions are
# cloned by install.sh (master of continuum has shipped broken before).
# Continuum MUST load after status-right above: it injects its autosave
# trigger into it.
set-option -g @continuum-restore 'on'
set-option -g @continuum-save-interval '10'
run-shell "if [ -d ~/.tmux/plugins/tmux-resurrect ]; then ~/.tmux/plugins/tmux-resurrect/resurrect.tmux; fi"
run-shell "if [ -d ~/.tmux/plugins/tmux-continuum ]; then ~/.tmux/plugins/tmux-continuum/continuum.tmux; fi"
