# claude-code-grid — tmux config. Source from ~/.tmux.conf:
#   source-file ~/dev/claude-code-grid/tmux/grid.tmux.conf

# Keep window names as set by the grid instead of tmux overwriting them with
# whatever process is running; Claude Code also rewrites the terminal title
# via escape sequences, which is why panes are labeled with @repo user
# options rather than pane_title.
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Claude Code's pulsating progress bar reaches the outer terminal as an
# OSC 9;4 passthrough sequence, which tmux swallows by default — without
# these the bar simply never appears in grid panes. RGB keeps its gradient
# smooth instead of banded to the 256-color palette. Claude Code probes the
# terminal at startup, so panes need a fresh session after a reload.
set-option -g allow-passthrough on
set-option -as terminal-features 'tmux-256color:RGB'

# Terminal tab title: session + every repo in the grid ("personal · repo1;
# repo2; repo3"), so the window is identifiable from the macOS Dock
# right-click menu / Mission Control / Window menu. The #{P:} loop walks the
# window's panes, prefixing "; " to all but pane 0 (a trailing-separator
# strip via #{s/../:} can't work here — ";" chains format modifiers and
# can't appear in the pattern). Falls back to window name when the active
# pane has no @repo (normal tmux use).
set-option -g set-titles on
set-option -g set-titles-string "#S · #{?#{@repo},#{P:#{?#{@repo},#{?#{e|>:#{pane_index},0},; ,}#{@repo},}},#W}"

# ── Pane borders: the grid as a dashboard ────────────────────────────────────
# Each border reads:  ⦿ ▲ repo-name (branch) ● 4m
#   ⦿  marked for targeted broadcast (prefix+m)
#   ▲  blocked on you   ▶ working   ✔ finished its turn   · idle
#   ●  uncommitted changes   ✓ clean
#   4m how long it's been in that state
#
# The state glyph is drawn with native #{?...} conditionals rather than by
# pane-border.sh on purpose: tmux caches #() output and only re-runs it on
# the status interval, so a glyph rendered by the script would lag the actual
# transition by up to 15 seconds. Native formats repaint the instant
# pane-state.sh sets @state, which is the entire point of the feature. The
# script keeps the parts that need a shell (git) and the elapsed time, where
# interval-fresh is fine.
#
# Styles are written as separate #[fg=..]#[bold] blocks, never
# "#[fg=..,bold]": a comma inside #{?...} is the argument separator and would
# split the conditional in the wrong place.
#
# User options in a condition are written #{?#{@opt},…}, not #{?@opt,…}.
# Current tmux resolves the bare name to the option's value, but the wrapped
# form is what the rest of this file uses and it doesn't depend on that
# lookup existing — worth the four characters given a mis-resolve would paint
# the marked glyph and the idle dot on every pane, grid or not.
set-option -g pane-border-status top
set-option -g pane-border-format "#{?#{@marked},#[fg=colour221]⦿ ,}#{?#{==:#{@state},waiting},#[fg=colour203]#[bold]#[blink]▲ #[default],#{?#{==:#{@state},working},#[fg=colour81]▶ #[default],#{?#{==:#{@state},done},#[fg=colour114]✔ #[default],#{?#{@repo},#[fg=colour240]· #[default],}}}}#(~/dev/claude-code-grid/scripts/pane-border.sh '#{@repo}' '#{@repo_color}' '#{pane_current_path}' '#{pane_title}' '#{@state}' '#{@state_since}')"

# ── Attention routing ────────────────────────────────────────────────────────
# prefix+n jumps to the pane that most wants you (blocked > finished, longest
# first), wrapping on repeat. With four sessions the scarce resource is your
# attention, not screen space — this turns scanning four panes into a queue.
# Overrides tmux's next-window, which a single-window grid has no use for.
bind-key n run-shell "~/dev/claude-code-grid/scripts/grid-next.sh '#{session_name}'"

# ── Broadcast ────────────────────────────────────────────────────────────────
# prefix+b types into ALL panes at once; the status bar shows a red banner
# while it's on so you can't forget. prefix+m marks a subset instead, for
# when "commit and push" is right for three panes and wrong for the fourth.
bind-key b set-window-option synchronize-panes
bind-key m run-shell "~/dev/claude-code-grid/scripts/grid-mark.sh '#{pane_id}'"

# ── Saved prompts ────────────────────────────────────────────────────────────
# prefix+p sends one to this pane, prefix+P to the marked panes (or all of
# them if nothing is marked). Files live in ~/.config/claude-code-grid/prompts.
#
# The -e vars matter: a popup is not a pane, so a script inside one can't ask
# tmux "which pane am I in". The binding captures the answer at press time
# and passes it in.
#
# Every -e value below MUST stay quoted: an unquoted #{...} in a command
# argument is read as the start of a comment, and the whole line dies with
# "syntax error" — including the closing quote of the command that follows.
bind-key p display-popup -E -w 70% -h 60% -e "GRID_SESSION=#{session_name}" -e "GRID_PANE=#{pane_id}" "~/dev/claude-code-grid/scripts/grid-prompt.sh current"
bind-key P display-popup -E -w 70% -h 60% -e "GRID_SESSION=#{session_name}" -e "GRID_PANE=#{pane_id}" "~/dev/claude-code-grid/scripts/grid-prompt.sh marked"

# ── Popups: information without spending a pane on it ────────────────────────
# prefix+g  every repo's branch / ahead-behind / dirty state / last commit
# prefix+B  the shared cross-repo board
# prefix+L  the worktree prune log (what was kept, and why)
bind-key g display-popup -E -w 80% -h 80% -e "GRID_SESSION=#{session_name}" "~/dev/claude-code-grid/scripts/grid-git.sh"
bind-key B display-popup -E -w 80% -h 70% -e "GRID_SESSION=#{session_name}" -e "GRID_PANE=#{pane_id}" "~/dev/claude-code-grid/scripts/grid-board.sh show"
bind-key L display-popup -E -w 80% -h 80% -e "GRID_SESSION=#{session_name}" "~/dev/claude-code-grid/scripts/grid-log.sh"

# ── Cheatsheet ───────────────────────────────────────────────────────────────
# prefix+? — the grid's keys and border glyphs. Shadows tmux's default
# list-keys, which dumps ~200 bindings that are almost entirely not the
# grid's; the popup points at `prefix : list-keys` for when you want those.
# Absolute rather than percentage size: the sheet is a fixed 33 lines by ~79
# columns, and a percentage that looked fine full-screen would clip it on a
# smaller client. tmux clamps to the client if it's smaller than this anyway.
bind-key ? display-popup -E -w 84 -h 41 "~/dev/claude-code-grid/scripts/grid-help.sh"

# ── Reshaping a live grid ────────────────────────────────────────────────────
# prefix+a adds a repo's pane, prefix+X drops one. Both beat the old answer
# of killing the session and re-picking, which threw away every healthy
# conversation to change one of them.
bind-key a display-popup -E -w 60% -h 60% -e "GRID_SESSION=#{session_name}" "~/dev/claude-code-grid/scripts/grid-add.sh"
bind-key X confirm-before -p "grid: drop #{@repo} and kill its session? (y/n)" "run-shell '~/dev/claude-code-grid/scripts/grid-drop.sh #{pane_id}'"

# ── Status bar ───────────────────────────────────────────────────────────────
# Left of the clock: the grid's state rollup (▲ blocked / ✔ done / ▶ working)
# then aggregate Claude plan usage for the attached session's account (limits
# are account-wide, so one readout covers every pane).
set-option -g status-interval 15
set-option -g status-right-length 100
# Session name in the theme's accent instead of the stock "[name]", plus the
# window:pane tally. The trailing spaces separate it from the window list.
set-option -g status-left-length 30
set-option -g status-left "#[fg=#{@theme_accent}]#[bold] #S #[nobold]#[fg=#{@theme_fg}]#{session_windows}w:#{window_panes}p  "
# Dark ground for the whole bar: the rollup/usage segments pick their own
# colours, which are tuned for dark and vanish against tmux's stock green.
set-option -g status-style "bg=colour233,fg=colour250"
set-option -g status-right "#{?pane_synchronized,#[bg=colour203 fg=colour232 bold] ⇄ BROADCAST #[default] ,}#(~/dev/claude-code-grid/scripts/grid-rollup.sh '#{session_name}')#(~/dev/claude-code-grid/scripts/tmux-usage.sh '#{session_name}')%a %d %b · %H:%M "

# ── Title line ───────────────────────────────────────────────────────────────
# Both status lines move to the top of the screen. Line 0 is a centered grid
# title — @grid_title, "pdev" unless a session sets its own; click it to
# retype — with a clickable ? at the far right opening the same cheatsheet as
# prefix+?. Line 1 is tmux's stock bar, spelled out literally: an added
# status line defaults to a pane list, not the normal bar, and no format
# variable names the stock layout to reference instead.
set-option -g status 2
set-option -g status-position top
set-option -g @grid_title "pdev"

# Chrome colors are read through @theme_* so grid-theme.sh can restyle
# without rewriting formats (right-click the title for the menu, scroll on it
# to cycle). These defaults keep a fresh server dressed until the saved theme
# loads below.
set-option -g @grid_theme grid
set-option -g @theme_accent colour45
set-option -g @theme_key colour221
set-option -g @theme_bg colour233
set-option -g @theme_fg colour250

# fill= paints the title line's own ground: without it the line sits on
# status-style, which the themes also own. No #[default] anywhere in this
# line — default resets to that base style mid-line.
#
# The #{P:} loop draws one ● per pane, colored like the border glyphs
# (waiting panes blink) — each dot is its own range=pane|id click target, so
# the title line doubles as a jump bar. Left corner: session + pane count.
# Right corner: the current theme as a ■-swatch button (click = theme menu)
# and the ? cheatsheet button.
set-option -g 'status-format[0]' '#[fill=#{@theme_bg}]#[align=left]#[fg=#{@theme_fg}]#[bg=#{@theme_bg}] #S · #{window_panes} panes  #[range=user|add]✚#[norange] #[range=user|git]⎇#(~/dev/claude-code-grid/scripts/grid-dirty.sh "#{session_name}")#[fg=#{@theme_fg}]#[norange] #[range=user|board]▤#[norange] #[range=user|prompt]✎#[norange]#[align=centre]#[range=user|title]#[fg=#{@theme_accent}]#[bg=#{@theme_bg}]#[bold] #{@grid_title} #[norange]#[nobold]  #{P:#[range=pane|#{pane_id}]#[bg=#{@theme_bg}]#{?#{==:#{@state},waiting},#[fg=colour203]#[blink],#{?#{==:#{@state},working},#[fg=colour81],#{?#{==:#{@state},done},#[fg=colour114],#[fg=colour240]}}}●#[noblink]#[norange] }#[align=right]#[range=user|zoom]#{?window_zoomed_flag,#[fg=#{@theme_bg}]#[bg=#{@theme_accent}]#[bold] ⛶ ,#[fg=#{@theme_fg}]#[bg=#{@theme_bg}] ⛶ }#[norange]#[bg=#{@theme_bg}]#[range=user|mute]#[bg=#{@theme_bg}] #{?#{@grid_mute},🔕,🔔} #[norange]#[bg=#{@theme_bg}]#[range=user|rain]#[bg=#{@theme_bg}] ☔ #[norange]#[bg=#{@theme_bg}]#[range=user|next]#[bg=#{@theme_bg}] 🐇 #[norange]#[bg=#{@theme_bg}]#[range=user|bcast]#{?pane_synchronized,#[fg=colour232]#[bg=colour203]#[bold] ⇄ ,#[fg=#{@theme_fg}]#[bg=#{@theme_bg}] ⇄ }#[norange]#[bg=#{@theme_bg}] #[range=user|theme]#[fg=#{@theme_bg}]#[bg=#{@theme_accent}]#[bold] ■ #{@grid_theme} #[norange]#[bg=#{@theme_bg}] #[range=user|help]#[fg=#{@theme_bg}]#[bg=#{@theme_key}]#[bold] ? #[norange]#[bg=#{@theme_bg}] '
set-option -g 'status-format[1]' "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# range=user|X clicks fire the Status mouse key — not StatusDefault — with
# mouse_status_range set to the bare X (tmux(1) STYLES). The final else keeps
# the stock select-window behavior this binding shadows, so clicking the
# window list on the second status line still works. A title click prompts
# for a new name, stored per-session (no -g) so pdev and wdev grids can be
# titled apart.
# Three cases stay native because they need the client context run-shell
# doesn't have (the rename prompt, and pane/window selection); every other
# chip funnels through grid-click.sh keyed on the range name.
bind-key -T root MouseDown1Status {
  if-shell -F '#{==:#{mouse_status_range},title}' {
    command-prompt -I '#{@grid_title}' -p 'grid title:' { set-option @grid_title '%%' }
  } {
    if-shell -F '#{==:#{mouse_status_range},pane}' {
      select-pane -t =
    } {
      if-shell -F '#{==:#{mouse_status_range},window}' {
        select-window -t =
      } {
        run-shell "~/dev/claude-code-grid/scripts/grid-click.sh '#{mouse_status_range}' '#{session_name}' '#{pane_id}'"
      }
    }
  }
}

# Right-click on the title: the theme menu. Everywhere else this shadows the
# stock window context menu, so that is reproduced verbatim as the fallback.
bind-key -T root MouseDown3Status {
  if-shell -F '#{==:#{mouse_status_range},title}' {
    run-shell "~/dev/claude-code-grid/scripts/grid-theme.sh menu"
  } {
    display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
  }
}

# Scrolling on the title cycles themes; on the window list it keeps the stock
# previous/next-window behavior it shadows.
bind-key -T root WheelUpStatus {
  if-shell -F '#{==:#{mouse_status_range},title}' {
    run-shell "~/dev/claude-code-grid/scripts/grid-theme.sh prev"
  } { previous-window }
}
bind-key -T root WheelDownStatus {
  if-shell -F '#{==:#{mouse_status_range},title}' {
    run-shell "~/dev/claude-code-grid/scripts/grid-theme.sh next"
  } { next-window }
}

# Right-click a pane: every grid key without remembering it. Items marked
# #{?#{@repo},,-} gray out on non-grid panes, where copy/zoom still apply.
# Shadows tmux's stock pane menu; copy mode and paste carry its essentials.
bind-key -T root MouseDown3Pane display-menu -t = -T "#[align=centre]#{?#{@repo},#{@repo},#{pane_title}}" -x M -y M \
  'zoom / unzoom' z { resize-pane -Z -t = } \
  '' \
  "#{?#{@repo},,-}#{?#{@marked},unmark,mark} for broadcast" m { run-shell "~/dev/claude-code-grid/scripts/grid-mark.sh '#{pane_id}'" } \
  "#{?#{@repo},,-}saved prompt here" p { display-popup -E -w 70% -h 60% -e "GRID_SESSION=#{session_name}" -e "GRID_PANE=#{pane_id}" "~/dev/claude-code-grid/scripts/grid-prompt.sh current" } \
  "#{?#{@repo},,-}repo colour…" c { run-shell "~/dev/claude-code-grid/scripts/grid-color.sh menu '#{pane_id}'" } \
  '' \
  'git across the grid' g { display-popup -E -w 80% -h 80% -e "GRID_SESSION=#{session_name}" "~/dev/claude-code-grid/scripts/grid-git.sh" } \
  'cheatsheet' k { display-popup -E -w 84 -h 41 "~/dev/claude-code-grid/scripts/grid-help.sh" } \
  'matrix rain' r { lock-server } \
  '' \
  'copy mode' [ { copy-mode -t = } \
  'paste' ] { paste-buffer -t = } \
  '' \
  "#{?#{@repo},,-}drop this repo" X { confirm-before -p "grid: drop #{@repo} and kill its session? (y/n)" "run-shell '~/dev/claude-code-grid/scripts/grid-drop.sh #{pane_id}'" }

# Right-click a pane's border: recolor that repo (persists via grid-color.sh).
bind-key -T root MouseDown3Border {
  if-shell -F '#{!=:#{@repo},}' {
    run-shell "~/dev/claude-code-grid/scripts/grid-color.sh menu '#{pane_id}'"
  }
}

# ── Screensaver ──────────────────────────────────────────────────────────────
# Ten idle minutes and every client dissolves into matrix rain, falling in
# the active theme's accent; any key or mouse click wakes it. `tmux
# lock-server` (or the ☔ chip, C-\, or the right-click pane menu) runs it
# on demand.
set-option -g lock-after-time 600
set-option -g lock-command "~/dev/claude-code-grid/scripts/grid-rain.sh"

# Win+L muscle memory: Ctrl+\ rains on demand from the keyboard. macOS hands
# ⌘-shortcuts to iTerm, never to tmux — to get literal ⌘L, add an iTerm key
# mapping (Settings → Profiles → Keys) sending hex 0x1C, which is this key.
bind-key -n 'C-\' lock-server

# Re-apply whichever theme was last picked, so a server restart comes back
# dressed. Runs after the @theme_* defaults above, which it overwrites.
run-shell "~/dev/claude-code-grid/scripts/grid-theme.sh load"

# Safety net: whenever ANY tmux session closes, the dispatcher checks
# whether it was one of the claude grids (has a worktree state file) and
# runs the safe prune on it. Catches raw kill-session/closing the terminal,
# not just pdev-stop/wdev-stop.
set-hook -g session-closed 'run-shell "~/dev/claude-code-grid/scripts/prune-dispatch.sh #{hook_session_name}"'

# ── Session persistence across reboots ───────────────────────────────────────
# resurrect saves layout/paths (prefix+Ctrl-s manual save, prefix+Ctrl-r
# restore); continuum auto-saves every 10 min and auto-restores when the tmux
# server first starts after a reboot.
#
# resurrect restores directories but not user options or running programs, so
# a bare restore leaves four anonymous shells. The post-restore hook rebuilds
# each pane's label/color from <session>.repos and relaunches Claude with
# --continue where a stored conversation exists — so a reboot resumes
# mid-conversation instead of cold. It must be set before resurrect loads.
#
# Pinned versions are cloned by install.sh (master of continuum has shipped
# broken before). Continuum MUST load after status-right above: it injects
# its autosave trigger into it.
set-option -g @resurrect-hook-post-restore-all '~/dev/claude-code-grid/scripts/grid-restore.sh'
set-option -g @continuum-restore 'on'
set-option -g @continuum-save-interval '10'
run-shell "if [ -d ~/.tmux/plugins/tmux-resurrect ]; then ~/.tmux/plugins/tmux-resurrect/resurrect.tmux; fi"
run-shell "if [ -d ~/.tmux/plugins/tmux-continuum ]; then ~/.tmux/plugins/tmux-continuum/continuum.tmux; fi"
